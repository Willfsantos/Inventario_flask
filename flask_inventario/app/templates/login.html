{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4 mt-5">
        <div class="card shadow border-0">
            <div class="card-header bg-dark text-white text-center py-3">
                <h4 class="mb-0">Acesso ao Sistema</h4>
            </div>
            <div class="card-body p-4">
                <!-- Se houver mensagens de erro de login, elas aparecerão aqui -->
                {% with messages = get_flashed_messages() %}
                  {% if messages %}
                    {% for message in messages %}
                      <div class="alert alert-danger py-2">{{ message }}</div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <form method="POST" action="/login">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Usuário</label>
                        <input type="text" name="username" class="form-control form-control-lg" required placeholder="Digite seu usuário">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Senha</label>
                        <input type="password" name="password" class="form-control form-control-lg" required placeholder="Digite sua senha">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Entrar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
